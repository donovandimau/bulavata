const bandFor = y => (new Date().getFullYear() - y) >= 18 ? "adult" : "teen";
const oldEnough = y => { const a = new Date().getFullYear() - y; return a >= 16 && a < 120; };
async function signUp(){
  const b=$("#a-go"); b.disabled=true; const err=$("#a-err"); err.textContent="";

  const {data:free, error:he} = await sb.rpc("bv_handle_free",{p_handle:handle});

    try{ localStorage.setItem("bv_pending", JSON.stringify({handle,name,band})); }catch(_){}
    err.textContent="Check your email to confirm, then sign in — your handle is saved.";
    b.disabled=false; return;
  }
  const {error:pe} = await sb.from("bv_profiles").insert({id:data.user.id,handle,display_name:name,age_band:band,...initialSkin()});
  if(pe){ err.textContent=pe.message; b.disabled=false; return; }

            <span class="ago">${ago(t.created_at)}</span>
          </div>

      : `<div class="empty"><em>🧾</em>Nothing yet. Your first top-up will show up here.</div>`}

async function walletTopUp(minor){
  const note = $("#w-pay-note"); if(note) note.textContent = "Opening the payment page…";
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(!session) { if(note) note.textContent = "Sign in again first."; return; }
    const r = await fetch(PAY_URL,{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+session.access_token},body:JSON.stringify({action:"topup",amount_minor:minor})});
    const j = await r.json().catch(()=>({}));
    if(j && j.url){ location.href = j.url; return; }
    if(note) note.textContent = (j.error==="not_configured"||j.error==="wallet_link_not_configured")
      ? "Adding money opens soon." : "Could not open the payment page. Try again shortly.";
  }catch(_){ if(note) note.textContent = "No connection. Try again when your signal is back."; }
}
async function walletClaim(sid){
  try{
    const r = await fetch(PAY_URL+"?claim="+encodeURIComponent(sid));
    const j = await r.json().catch(()=>({}));
    if(j && j.ok) toast("Money added to your wallet.");
  }catch(_){}
}
async function walletSend(){
  const err = $("#wl-err"); if(err) err.textContent = "";
  const to = (($("#wl-to")||{}).value||"").trim().replace(/^@/,"").toLowerCase();
  const amt = Math.round(parseFloat((($("#wl-amt")||{}).value||"0").replace(/[^0-9.]/g,""))*100);
  const memo = (($("#wl-memo")||{}).value||"").trim()||null;
  if(!/^[a-z0-9_]{3,20}$/.test(to)) { if(err) err.textContent = "Check the handle."; return; }
  if(!Number.isInteger(amt)||amt<100) { if(err) err.textContent = "Send at least 1.00."; return; }
  const {data,error} = await sb.rpc("bv_wallet_send",{p_to_handle:to,p_amount_minor:amt,p_memo:memo,p_idem:S.user.id+"-"+Date.now()});
  if(error){ if(err) err.textContent = "That did not go through."; return; }
  if(data && data.status==="error"){
    const say = {INSUFFICIENT_FUNDS:"Not enough in your wallet.",DAILY_LIMIT_EXCEEDED:"That is over your limit for today.",
      NO_SUCH_WALLET:"Nobody with that handle.",SELF_SEND:"That is your own wallet.",NO_WALLET:"Your wallet is not open yet.",
      WALLET_DORMANT:"Add money first to wake your wallet up.",WALLET_FROZEN:"Your wallet is frozen.",
      WALLET_CLOSED:"Your wallet is closed.",CURRENCY_MISMATCH:"Those two wallets hold different money.",
      BAD_AMOUNT:"Check the amount.",NOT_SIGNED_IN:"Sign in again first."};
    if(err) err.textContent = say[data.reason] || "That did not go through.";
    return;
  }
  toast("Sent.");
  await render();
}

function installAuthLifecycle(){
  S.authSubscription?.unsubscribe();
  let owner=S.user?.id||null,change=0;
  const result=sb.auth.onAuthStateChange((event,session)=>{
    const next=session?.user?.id||null,previous=owner||S.user?.id||null;
    if(event==='INITIAL_SESSION'&&(!previous||next===previous)){owner=next;return;}
    if(event!=='SIGNED_OUT'&&next===previous){owner=next;return;}
    owner=next;const revision=++change;
    viewRun();
    S.user=null;S.me=null;S.friends=[];S.pending=[];S.wallet=null;S.crew=null;S.roomHandle=null;S.tab='pulse';S.luv=0;S.metaErrors={};S.sendingMessage=false;
    window.SotaSpaceDesign?.apply();
    S.searchRevision=(S.searchRevision||0)+1;
    window.SotaCircles?.stop();window.SotaConnections?.stop();window.SotaKavaUI?.stop();window.SotaRoomSocial?.stop();window.SotaRoomSocialLayout?.stop();window.BulaSkinStudio?.closeForOwnerChange?.();
    app.replaceChildren();
    // Supabase work runs after its synchronous auth callback has returned.
    setTimeout(()=>{if(revision!==change)return;if(next)boot();else renderAuth();},0);
  });
  S.authSubscription=result?.data?.subscription||null;
}

}
async function search(){
  const q=$("#s-q").value.trim().toLowerCase().replace(/^@/,""); if(!q) return;
  const run=viewRun(false),results=$('#s-res'),searchRevision=(S.searchRevision||0)+1;S.searchRevision=searchRevision;
  results.textContent='Finding your people…';
  const {data,error}=await requestResult(sb.from("bv_profiles").select("id,handle,display_name,avatar_emoji")
    .ilike("handle",`%${q}%`).neq("id",S.user.id).limit(10));
  if(!currentView(run)||S.searchRevision!==searchRevision||$('#s-res')!==results)return;
  if(error){results.innerHTML='<p role="alert">Search could not load. Your connection may be interrupted.</p><button type="button" class="btn sm" onclick="search()">Try again</button>';return;}
  results.innerHTML=(data||[]).length? data.map(p=>`
    <div class="pulse-item"><div class="av sm">${esc(p.avatar_emoji||'🌺')}</div>
      <div style="flex:1;min-width:0"><div class="name">${esc(p.display_name||p.handle)}</div>
        <div class="handle">@${esc(p.handle)}</div></div>
      <button class="btn sm" onclick="addFriend('${esc(p.id)}')">Ask</button></div>`).join("")
    : `<div class="sub">Nobody with that handle.</div>`;
}
async function respond(id,act){
  if(act==='reject') await sb.from("bv_friendships").delete().eq("id",id);
  else await sb.from("bv_friendships").update({status:'accepted'}).eq("id",id);
  await refreshMeta(); render();
}

/* ================= ROUTER ================= */
async function render(){
  const run=viewRun();
  if(S.tab==="connections") return window.SotaConnections.view();
  await refreshMeta();
  if(!currentView(run))return;
  if(S.tab==="pulse") return viewPulse();
  if(S.tab==="moments") return viewMoments();
  if(S.tab==="room") return viewRoom();
  if(S.tab==="circles") return window.SotaKavaUI.view();
  if(S.tab==="crews") return viewCrews();
  if(S.tab==="friends") return viewFriends();
  if(S.tab==="wallet") return viewWallet();
}
async function boot(){
  if(typeof location==='object'&&location.hash==="#connections=example")return window.SotaConnections.preview();
  const run=typeof viewRun==='function'?viewRun():null,stillHere=()=>!run||currentView(run);
  const personal=typeof location==='object'&&location.hash==='#connections=mine';
  const circleRoute=typeof location==='object'&&/^#(?:circle-invite|circle-graph|friends-graph)=/.test(location.hash);
  const publicGraphRoute=typeof location==='object'&&/^#(?:circle-graph|friends-graph)=/.test(location.hash);
  if(!navigator.onLine){renderAuth('in',personal);if(circleRoute)window.SotaCircles?.route();return;}
  const {data:{session}} = await sb.auth.getSession();
  if(!stillHere())return;
  if(!session){renderAuth('in',personal);if(circleRoute)window.SotaCircles?.route();return;}
  S.user = session.user;
  window.SotaSpaceDesign?.apply();
  if(run)run.user=S.user.id;
  if(publicGraphRoute){
    shell('<section class="glass card"><h1>Our Talanoa Circle</h1><p>A public view, shared by people who chose to appear.</p><a class="btn" href="/">Back to Sota Kece</a></section>');
    window.SotaCircles?.route();return;
  }
  const {data:me,error:profileError} = await sb.from("bv_profiles").select("*").eq("id",S.user.id).maybeSingle();
  if(!stillHere())return;
  if(profileError)return shell(`<div class="glass card"><h3>Your room is still yours.</h3><p>Connection interrupted. Try loading it again when your signal returns.</p><button class="btn" onclick="boot()">Try again</button></div>`);
  if(!me) return finishRoom();
  S.me = me;
  if(circleRoute){
    shell('<section class="glass card"><h1>Our Talanoa Circle</h1><p>Your circle link is ready to open.</p><button type="button" class="btn" onclick="go(\'crews\')">Your circles</button></section>');
    window.SotaCircles?.route();return;
  }
  document.documentElement.style.setProperty("--accent", me.room_accent||"#4FA8D8");
  sb.rpc("bv_touch");
  try{
    const sid = new URLSearchParams(location.search).get("sid");
    if(sid && /^cs_[A-Za-z0-9_]+$/.test(sid)){
      await walletClaim(sid);
      if(!stillHere())return;
      history.replaceState({}, "", location.pathname);
      S.tab = "wallet";
    }
  }catch(_){}
  if(personal){S.tab='connections';return render();}
  let pendingMate='';try{pendingMate=sessionStorage.getItem('sota-find-mate')||'';}catch(_){}
  if(/^[a-z0-9_]{3,20}$/.test(pendingMate)){
    S.tab='friends';await render();
    if($('#s-q')){ $('#s-q').value=pendingMate;try{sessionStorage.removeItem('sota-find-mate');}catch(_){}await search(); }
  }else await render();
  await window.SotaCircles?.resumeDraft?.();
}
/* Signed in, but no room yet. Never sign them out - let them finish. */
function finishRoom(){
  viewRun();
  let pre={}; try{ pre=JSON.parse(localStorage.getItem("bv_pending")||"{}"); }catch(_){}
  app.innerHTML=`
  <div class="glass authwrap">
    <div class="row" style="gap:12px">${LOGO}
      <div class="brand">Sota Kece<small>alive together</small></div></div>
    <p class="tagline">You are signed in as <b style="font-weight:600;color:var(--ink)">${esc(S.user.email||"you")}</b>,
      but you have not made your room yet. One screen and you are in.</p>
    <div class="stack">
      <div><label for="f-handle">Your handle</label><input id="f-handle" value="${esc(pre.handle||'')}" placeholder="bula_sina" maxlength="20" autocapitalize="off">
        <div class="sub" style="margin-top:5px">Lowercase letters, numbers and underscores.</div></div>
      <div><label for="f-name">Display name</label><input id="f-name" value="${esc(pre.name||'')}" placeholder="Sina" maxlength="40"></div>
      <div><label for="f-year">Year you were born</label><input id="f-year" type="number" inputmode="numeric" placeholder="e.g. 2004" min="1900" max="${new Date().getFullYear()}"></div>
      <button class="btn" id="f-go">Make my room</button>
      <div class="sub" id="f-err" role="alert" style="color:var(--coral);text-align:center"></div>
      <button class="btn ghost" onclick="sb.auth.signOut().then(()=>location.reload())">Sign out instead</button>
    </div>
  </div>`;
  $("#f-go").onclick = async () => {
    const b=$("#f-go"), err=$("#f-err"); b.disabled=true; err.textContent="";
    const handle=$("#f-handle").value.trim().toLowerCase(), name=$("#f-name").value.trim(), year=parseInt($("#f-year").value);
    if(!/^[a-z0-9_]{3,20}$/.test(handle)){ err.textContent="Handle: 3-20 lowercase letters, numbers or _"; b.disabled=false; return; }
    if(!name){ err.textContent="Pick a display name."; b.disabled=false; return; }
    if(!oldEnough(year)){ err.textContent="Sota Kece is for 16 and over."; b.disabled=false; return; }
    const {data:free}=await sb.rpc("bv_handle_free",{p_handle:handle});
    if(free===false){ err.textContent="That handle is taken."; b.disabled=false; return; }
    const {error}=await sb.from("bv_profiles").insert({id:S.user.id,handle,display_name:name,
      age_band:bandFor(year),...initialSkin()});
    if(error){ err.textContent=error.message; b.disabled=false; return; }
    try{ localStorage.removeItem("bv_pending"); }catch(_){}
    boot();
  };
  app.querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")$("#f-go").click()}));
}
window.go=go; window.openRoom=openRoom; window.renderAuth=renderAuth; window.sb=sb;
window.SotaView={invalidate:()=>viewRun()};
</script>
