name: Sota Kece checks
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
jobs:
  social-and-skins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
