name: Sota Kece Revised checks
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
permissions:
  contents: read
jobs:
  original-app:
    runs-on: ubuntu-latest
    env:
      NODE_PATH: ${{ github.workspace }}/tests/talanoa-tools/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: tests/talanoa-tools
      - run: node --test tests/revised-app.test.cjs tests/revised-ui.test.cjs tests/revised-combined.test.cjs tests/space-design.test.cjs tests/space-design-options.test.cjs tests/sota-experience.test.cjs tests/sota-creation-entry.test.cjs tests/revised-design.test.cjs
